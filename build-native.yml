name: Build QALA Desktop EXE and Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install -D electron electron-builder
      - run: npx electron-builder --win nsis --config electron-builder.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: qala-windows-exe
          path: release-exe/*.exe

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qala-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
